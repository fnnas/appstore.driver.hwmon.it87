name: 6.18.18-trim-570-amd64
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call:  # This allows this workflow to be called from another workflow
    inputs:
      proj_name:
        required: true
        type: string
        default: "ite-it87"
      target_commit_sha:
        required: true
        type: string
        default: "HEAD"

jobs:

  build:
    runs-on: ubuntu-latest
    container:
      image: makedie/fnos:kernHead-6.18.18-trim-570-amd64
      options: -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      kernel_name: "6.18.18-trim-570-amd64"
      kernel_ver: "6.18.18-trim"
    steps:
      - name: Check out repository code
        run: |
          git clone https://github.com/fnnas/it87.git
          cd it87 && git reset --hard "${{ inputs.target_commit_sha }}"
      - name: build ko
        run: |
          cd it87
          make -j`nproc`
      - name: copy ko
        run: |
          mkdir -p upload/${{ inputs.proj_name }}_${{ env.kernel_name }}
          cp ./it87/*.ko ./upload/${{ inputs.proj_name }}_${{ env.kernel_name }}/
          ls -la ./upload/${{ inputs.proj_name }}_${{ env.kernel_name }}/
      - name: upload ko
        uses: actions/upload-artifact@master
        with:
          name: ${{ inputs.proj_name }}-${{ env.kernel_name }}
          path: upload
