name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} sha ${{ github.sha }}

permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: false

env:
  proj_name: "ite-it87"
  target_commit_sha: "20f2f2f"
  this_pack_manifest_version: "1.0.5"
  this_pack_manifest_arch: "x86_64"
  this_pack_manifest_platform: "x86_64"
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      proj_name: ${{ env.proj_name }}
      target_commit_sha: ${{ env.target_commit_sha }}
    steps:
      - run: echo "All set!"
  build_6-12-18-trim-3:
    uses: ./.github/workflows/kernel-6.12.18-trim-3.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
  build_6-18-6-trim-297:
    uses: ./.github/workflows/kernel-6.18.6-trim-297-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
  build_6-18-18-trim-427:
    uses: ./.github/workflows/kernel-6.18.18-trim-427-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
  build_6-18-18-trim-570:
    uses: ./.github/workflows/kernel-6.18.18-trim-570-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
  build_6-18-18-trim-587:
    uses: ./.github/workflows/kernel-6.18.18-trim-587-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}

  pack_app_tgz:
    needs:
      - build_6-12-18-trim-3
      - build_6-18-6-trim-297
      - build_6-18-18-trim-427
      - build_6-18-18-trim-570
      - build_6-18-18-trim-587
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: restore 6-12-18-trim-3
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.12.18-trim_3
          path: app/app/
      - name: restore 6-18-6-trim-297
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.6-trim-297-amd64
          path: app/app/
      - name: restore 6-18-18-trim-427
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-427-amd64
          path: app/app/
      - name: restore 6-18-18-trim-570
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-570-amd64
          path: app/app/
      - name: restore 6-18-18-trim-587
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-587-amd64
          path: app/app/

      - name: 替换manifest版本及架构信息
        run: |
          sed "s|target_commit_sha|${{ env.target_commit_sha }}|g" -i ./package/manifest
          sed "s|this_pack_manifest_version|${{ env.this_pack_manifest_version }}|g" -i ./package/manifest
          sed "s|this_pack_manifest_arch|${{ env.this_pack_manifest_arch }}|g" -i ./package/manifest
          sed "s|this_pack_manifest_platform|${{ env.this_pack_manifest_platform }}|g" -i ./package/manifest
      - name: 打包app.tgz
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../package/
      - name: 打包package
        run: |
          tar zcvf appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz package
      - name: 上传应用包
        uses: actions/upload-artifact@master
        with:
          name: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz
          path: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz

      - name: Create GitHub Release
        if: ${{ inputs.make_release }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.this_pack_manifest_version }}
          prerelease: true
          release_name: "fnnas.appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}"
      - name: Upload Release Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading release assets..."
          
          echo "Uploading appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz"
          gh release upload "${{ env.this_pack_manifest_version }}" "appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz" || echo "Failed to upload $file"
          
          echo "Upload completed!"

      - name: Verify Uploaded Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploaded assets:"
          gh release view "${{ env.this_pack_manifest_version }}" --json assets -q '.assets[].name'
