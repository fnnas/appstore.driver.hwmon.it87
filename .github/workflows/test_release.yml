name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} sha ${{ github.sha }}

permissions:
  contents: read
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create a GitHub Release after the package is built'
        required: true
        type: boolean
        default: false
      enable_ccache:
        description: 'Enable ccache for kernel module builds'
        required: true
        type: boolean
        default: true

env:
  proj_name: "ite-it87"
  target_commit_sha: "c567739"
  this_pack_manifest_version: "1.0.13"
  this_pack_manifest_arch: "x86_64"
  this_pack_manifest_platform: "x86"
jobs:
  validate_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run workflow and shell validation
        run: |
          bash scripts/validate-workflows-and-scripts.sh

  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.container_image }}
      options: -v ${{ github.workspace }}:${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_name: "6.12.18-trim_3"
            kernel_ver: "6.12.18-trim"
            container_image: "makedie/fnos:kernHead-6.12.18-trim-3"
            artifact_name: "ite-it87-6.12.18-trim_3"
            module_dir: "ite-it87_6.12.18-trim_3"
          - kernel_name: "6.18.6-trim-297-amd64"
            kernel_ver: "6.18.6-trim"
            container_image: "makedie/fnos:kernHead-6.18.6-trim-297-amd64"
            artifact_name: "ite-it87-6.18.6-trim-297-amd64"
            module_dir: "ite-it87_6.18.6-trim-297-amd64"
          - kernel_name: "6.18.18-trim-427-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-427-amd64"
            artifact_name: "ite-it87-6.18.18-trim-427-amd64"
            module_dir: "ite-it87_6.18.18-trim-427-amd64"
          - kernel_name: "6.18.18-trim-570-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-570-amd64"
            artifact_name: "ite-it87-6.18.18-trim-570-amd64"
            module_dir: "ite-it87_6.18.18-trim-570-amd64"
          - kernel_name: "6.18.18-trim-587-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-587-amd64"
            artifact_name: "ite-it87-6.18.18-trim-587-amd64"
            module_dir: "ite-it87_6.18.18-trim-587-amd64"
          - kernel_name: "6.18.18-trim-717-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-717-amd64"
            artifact_name: "ite-it87-6.18.18-trim-717-amd64"
            module_dir: "ite-it87_6.18.18-trim-717-amd64"
          - kernel_name: "6.18.18.c788-trim-amd64"
            kernel_ver: "6.18.18.c788-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c788-trim-amd64"
            artifact_name: "ite-it87-6.18.18.c788-trim-amd64"
            module_dir: "ite-it87_6.18.18.c788-trim-amd64"
          - kernel_name: "6.18.18.c877-trim-amd64"
            kernel_ver: "6.18.18.c877-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c877-trim-amd64"
            artifact_name: "ite-it87-6.18.18.c877-trim-amd64"
            module_dir: "ite-it87_6.18.18.c877-trim-amd64"
          - kernel_name: "6.18.18.c938-trim-amd64"
            kernel_ver: "6.18.18.c938-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c938-trim-amd64"
            artifact_name: "ite-it87-6.18.18.c938-trim-amd64"
            module_dir: "ite-it87_6.18.18.c938-trim-amd64"
          - kernel_name: "6.18.18.c952-trim-amd64"
            kernel_ver: "6.18.18.c952-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c952-trim-amd64"
            artifact_name: "ite-it87-6.18.18.c952-trim-amd64"
            module_dir: "ite-it87_6.18.18.c952-trim-amd64"
          - kernel_name: "6.18.18.c1032-trim-amd64"
            kernel_ver: "6.18.18.c1032-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1032-trim-amd64"
            artifact_name: "ite-it87-6.18.18.c1032-trim-amd64"
            module_dir: "ite-it87_6.18.18.c1032-trim-amd64"
          - kernel_name: "6.18.18.c1078-trim-amd64"
            kernel_ver: "6.18.18.c1078-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1078-trim-amd64"
            artifact_name: "ite-it87-6.18.18.c1078-trim-amd64"
            module_dir: "ite-it87_6.18.18.c1078-trim-amd64"
    env:
      kernel_name: ${{ matrix.kernel_name }}
      kernel_ver: ${{ matrix.kernel_ver }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.kernel_name }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 1G
      CCACHE_KEY: ccache-${{ matrix.kernel_name }}-it87-${{ github.run_id }}-${{ github.run_attempt }}
      CCACHE_RESTORE_PREFIX: ccache-${{ matrix.kernel_name }}-it87-
    steps:
      - name: Restore ccache
        if: ${{ inputs.enable_ccache }}
        id: restore_ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            ${{ env.CCACHE_RESTORE_PREFIX }}
      - name: Check out driver source
        run: |
          git clone https://github.com/fnnas/it87.git
          cd it87 && git reset --hard "${{ env.target_commit_sha }}"
      - name: Set up ccache
        if: ${{ inputs.enable_ccache }}
        id: setup_ccache
        shell: bash
        run: |
          apt-get update
          apt-get install -y ccache
          mkdir -p "$CCACHE_DIR" "$GITHUB_WORKSPACE/ccache-bin"
          ccache_path="$(command -v ccache)"
          declare -A seen=()
          while IFS= read -r compiler; do
            case "$compiler" in
              gcc|g++|cc|c++|gcc-[0-9]*|g++-[0-9]*|cc-[0-9]*|c++-[0-9]*|*-gcc|*-g++|*-cc|*-c++|*-gcc-[0-9]*|*-g++-[0-9]*|*-cc-[0-9]*|*-c++-[0-9]*)
                [[ -n "${seen[$compiler]+x}" ]] && continue
                compiler_path="$(command -v "$compiler" || true)"
                [[ -x "$compiler_path" ]] || continue
                ln -sf "$ccache_path" "$GITHUB_WORKSPACE/ccache-bin/$compiler"
                seen[$compiler]=1
                ;;
            esac
          done < <(compgen -c | sort -u)
          echo "$GITHUB_WORKSPACE/ccache-bin" >> "$GITHUB_PATH"
          ccache --version
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=path="$PATH"
          ccache --zero-stats
          ccache --show-config
          echo "ccache wrappers:"
          find "$GITHUB_WORKSPACE/ccache-bin" -maxdepth 1 -type l -printf '%f -> %l\n' | sort
      - name: Build kernel module for matrix row
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "compiler resolution before build:"
            for compiler in cc gcc g++ c++ x86_64-linux-gnu-gcc x86_64-linux-gnu-g++; do
              if command -v "$compiler" >/dev/null 2>&1; then
                echo "$compiler -> $(command -v "$compiler")"
              fi
            done
          fi
          cd it87
          # shellcheck disable=SC2046
          make -j$(nproc)
      - name: Show ccache stats
        if: ${{ always() && inputs.enable_ccache }}
        shell: bash
        run: |
          ccache --show-stats || true
      - name: Save ccache
        if: ${{ always() && inputs.enable_ccache && steps.setup_ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_KEY }}
      - name: Stage kernel module artifact
        run: |
          mkdir -p "upload/${{ matrix.module_dir }}"
          cp ./it87/*.ko "./upload/${{ matrix.module_dir }}/"
          ls -la "./upload/${{ matrix.module_dir }}/"
      - name: Upload matrix build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: upload/${{ matrix.module_dir }}

  prune_ccache:
    if: ${{ always() && inputs.enable_ccache && needs.build.result == 'success' }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep latest two it87 ccache entries per kernel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Listing it87 kernel ccache entries..."
          caches_file="$(mktemp)"
          delete_file="$(mktemp)"

          gh cache list --key ccache- --limit 1000 --json id,key,createdAt,lastAccessedAt,sizeInBytes > "$caches_file"

          cache_count="$(jq 'length' "$caches_file")"
          echo "Found $cache_count cache entries."
          jq -r '
            sort_by(.key)
            | .[]
            | "- id=\(.id) key=\(.key) createdAt=\(.createdAt) lastAccessedAt=\(.lastAccessedAt) size=\(.sizeInBytes)"
          ' "$caches_file"

          jq -c '
            map(select(.key | test("^ccache-.+-it87-[0-9]+-[0-9]+$")))
            | group_by(.key | sub("-[0-9]+-[0-9]+$"; ""))
            | map(sort_by(.createdAt) | reverse | .[2:][]?)
            | .[]
          ' "$caches_file" > "$delete_file"

          delete_count="$(jq -s 'length' "$delete_file")"
          if [ "$delete_count" -eq 0 ]; then
            echo "No old ccache entries to delete."
            exit 0
          fi

          echo "Deleting $delete_count old ccache entries. Keeping latest two entries per key prefix."
          while IFS= read -r cache; do
            [ -n "$cache" ] || continue
            cache_id="$(jq -r '.id' <<< "$cache")"
            cache_key="$(jq -r '.key' <<< "$cache")"
            if ! grep -Eq '^ccache-.+-it87-[0-9]+-[0-9]+$' <<< "$cache_key"; then
              echo "::warning::Skip non-it87 ccache key=$cache_key"
              continue
            fi
            echo "::group::Delete cache id=$cache_id key=$cache_key"
            if output="$(gh cache delete "$cache_id" 2>&1)"; then
              echo "Deleted cache id=$cache_id key=$cache_key"
            else
              status="$?"
              echo "::warning::Failed to delete cache id=$cache_id key=$cache_key exit=$status"
              echo "$output"
            fi
            echo "::endgroup::"
          done < "$delete_file"

  pack_app_tgz:
    needs:
      - validate_workflow
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Download matrix artifact 6.12.18-trim_3
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.12.18-trim_3
          path: app/app/ite-it87_6.12.18-trim_3/
      - name: Download matrix artifact 6.18.6-trim-297-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.6-trim-297-amd64
          path: app/app/ite-it87_6.18.6-trim-297-amd64/
      - name: Download matrix artifact 6.18.18-trim-427-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-427-amd64
          path: app/app/ite-it87_6.18.18-trim-427-amd64/
      - name: Download matrix artifact 6.18.18-trim-570-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-570-amd64
          path: app/app/ite-it87_6.18.18-trim-570-amd64/
      - name: Download matrix artifact 6.18.18-trim-587-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-587-amd64
          path: app/app/ite-it87_6.18.18-trim-587-amd64/
      - name: Download matrix artifact 6.18.18-trim-717-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-717-amd64
          path: app/app/ite-it87_6.18.18-trim-717-amd64/
      - name: Download matrix artifact 6.18.18.c788-trim-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18.c788-trim-amd64
          path: app/app/ite-it87_6.18.18.c788-trim-amd64/
      - name: Download matrix artifact 6.18.18.c877-trim-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18.c877-trim-amd64
          path: app/app/ite-it87_6.18.18.c877-trim-amd64/
      - name: Download matrix artifact 6.18.18.c938-trim-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18.c938-trim-amd64
          path: app/app/ite-it87_6.18.18.c938-trim-amd64/
      - name: Download matrix artifact 6.18.18.c952-trim-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18.c952-trim-amd64
          path: app/app/ite-it87_6.18.18.c952-trim-amd64/
      - name: Download matrix artifact 6.18.18.c1032-trim-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18.c1032-trim-amd64
          path: app/app/ite-it87_6.18.18.c1032-trim-amd64/
      - name: Download matrix artifact 6.18.18.c1078-trim-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18.c1078-trim-amd64
          path: app/app/ite-it87_6.18.18.c1078-trim-amd64/

      - name: Stage driver source for optional local builds
        shell: bash
        run: |
          set -euo pipefail
          source_checkout="$(mktemp -d)"
          cleanup_source_checkout() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if rm -rf -- "$source_checkout" 2>/dev/null; then
                return 0
              fi
              sleep "$attempt"
            done
            echo "::warning::Unable to fully remove temporary source checkout: $source_checkout"
          }
          trap cleanup_source_checkout EXIT

          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/fnnas/it87.git "$source_checkout"
          mkdir -p app/app/it87-source
          git -C "$source_checkout" archive --format=tar "${{ env.target_commit_sha }}" -- \
            COPYING Makefile compat.h it87.c | tar -x -C app/app/it87-source
          printf '%s\n' "${{ env.target_commit_sha }}" > app/app/it87-source/VERSION

      - name: Replace manifest build-time values
        run: |
          sed -i \
            -e "s|target_commit_sha|${{ env.target_commit_sha }}|g" \
            -e "s|this_pack_manifest_version|${{ env.this_pack_manifest_version }}|g" \
            -e "s|this_pack_manifest_arch|${{ env.this_pack_manifest_arch }}|g" \
            -e "s|this_pack_manifest_platform|${{ env.this_pack_manifest_platform }}|g" \
            package/manifest
      - name: Package app.tgz from staged app files
        run: |
          cd app/
          tar zcvf app.tgz app ui
          cp app.tgz ../package/app.tgz
      - name: Validate packaged files
        run: |
          bash scripts/validate-package.sh package
      - name: Package final appstore archive
        run: |
          tar zcvf appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz package
      - name: Upload packaged app artifact
        uses: actions/upload-artifact@v4
        with:
          name: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz
          path: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz

  release:
    needs: pack_app_tgz
    if: ${{ inputs.make_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.this_pack_manifest_version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}" \
            --notes ""
      - name: Rename release asset extension
        env:
          PACKAGE_FILE: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz
          RELEASE_PACKAGE_FILE: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk
        run: |
          mv "$PACKAGE_FILE" "$RELEASE_PACKAGE_FILE"
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_FILE: appstore.driver.hwmon.${{ env.proj_name }}-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk
        run: |
          gh release upload "${{ env.this_pack_manifest_version }}" "$PACKAGE_FILE" --repo "${GITHUB_REPOSITORY}"
      - name: Verify Uploaded Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ env.this_pack_manifest_version }}" --repo "${GITHUB_REPOSITORY}" --json assets -q '.assets[].name'
